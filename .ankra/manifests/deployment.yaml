apiVersion: v1
kind: ServiceAccount
metadata:
  name: jukebox
  labels:
    app.kubernetes.io/name: jukebox
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jukebox
  labels:
    app.kubernetes.io/name: jukebox
  annotations:
    ankra.io/generated: "true"
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: jukebox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jukebox
    spec:
      serviceAccountName: jukebox
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ankra-registry-pull
      containers:
        - name: jukebox
          image: registry.ankra.cloud/org-89d96b20-8682-424c-8696-4d883f18dbb0/jukebox:${{ ankra.image_tag }}
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: ANKRA_RELEASE
              value: "${{ ankra.image_tag }}"
            - name: NODE_ENV
              value: "production"
            - name: HOST
              value: "::"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 150
            periodSeconds: 2
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
